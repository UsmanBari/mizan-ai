# Full stack: docker compose up --build   ->  web http://localhost:3000 , API http://localhost:8000/docs
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: mizan, POSTGRES_PASSWORD: mizan, POSTGRES_DB: mizan }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      MIZAN_DATABASE_URL: postgresql://mizan:mizan@db:5432/mizan
      MIZAN_REDIS_URL: redis://redis:6379/0
    volumes: [data:/data, hf:/root/.cache/huggingface]
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: celery -A mizan.worker worker -B -l info
    env_file: .env
    environment:
      MIZAN_DATABASE_URL: postgresql://mizan:mizan@db:5432/mizan
      MIZAN_REDIS_URL: redis://redis:6379/0
    volumes: [data:/data, hf:/root/.cache/huggingface]
    depends_on: [db, redis]
  web:
    build: { context: ., dockerfile: frontend/Dockerfile, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { pgdata: {}, data: {}, hf: {} }
